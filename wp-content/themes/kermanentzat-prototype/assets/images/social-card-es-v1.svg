<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Memoria, verdad y justicia para Kerman</title>
  <desc id="description">Tarjeta de Egia Kermanentzat con el retrato de Kerman.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Anton";
        src: url("../fonts/anton-latin-ext.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("../fonts/public-sans-latin-ext.woff2") format("woff2");
        font-weight: 400 700;
      }
      .brand {
        font: 700 29px "Public Sans", Arial, sans-serif;
        letter-spacing: 0.02em;
      }
      .headline {
        font: 400 73px "Anton", Impact, sans-serif;
        letter-spacing: -0.012em;
      }
      .domain {
        font: 600 25px "Public Sans", Arial, sans-serif;
        letter-spacing: 0.025em;
      }
    </style>
    <clipPath id="portrait-clip">
      <rect x="770" width="430" height="630"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="18" height="630" fill="#ff3131"/>

  <text class="brand" x="66" y="77" fill="#090909">EGIA</text>
  <text class="brand" x="146" y="77" fill="#d71920">KERMANENTZAT</text>
  <rect x="66" y="104" width="626" height="5" fill="#090909"/>

  <text class="headline" x="66" y="225" fill="#090909">MEMORIA, VERDAD</text>
  <text class="headline" x="66" y="323" fill="#090909">Y JUSTICIA</text>
  <text class="headline" x="66" y="421" fill="#090909">PARA KERMAN</text>

  <rect x="18" y="500" width="716" height="18" fill="#ff3131"/>
  <rect x="18" y="518" width="716" height="112" fill="#090909"/>
  <text class="domain" x="66" y="585" fill="#ffffff">egiakermanentzat.eus</text>

  <rect x="734" y="0" width="18" height="630" fill="#d71920"/>
  <rect x="752" y="0" width="18" height="630" fill="#090909"/>
  <image href="kerman-portrait-clean.png" x="770" y="0" width="430" height="630"
         preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait-clip)"/>
</svg>
