<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Egia Kermanentzat</title>
  <desc id="description">Kermanen zuri-beltzeko erretratua, Egia Kermanentzat elkartearen identitatearekin.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Anton";
        src: url("../fonts/anton-latin-ext.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("../fonts/public-sans-latin-ext.woff2") format("woff2");
        font-weight: 400 700;
      }
      .brand {
        font: 400 64px "Anton", Impact, sans-serif;
        letter-spacing: -0.012em;
      }
      .domain {
        font: 600 27px "Public Sans", Arial, sans-serif;
        letter-spacing: 0.025em;
      }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff"/>
  <rect width="1200" height="150" fill="#090909"/>
  <text class="brand" x="600" y="101" text-anchor="middle">
    <tspan fill="#ffffff">EGIA </tspan><tspan fill="#ff3131">KERMANENTZAT</tspan>
  </text>

  <rect y="150" width="1200" height="24" fill="#ff3131"/>
  <image href="kerman-portrait-clean.png" x="161" y="174" width="878" height="932" preserveAspectRatio="xMidYMid meet"/>
  <rect y="1106" width="1200" height="24" fill="#ff3131"/>
  <rect y="1130" width="1200" height="70" fill="#090909"/>
  <text class="domain" x="600" y="1176" fill="#ffffff" text-anchor="middle">egiakermanentzat.eus</text>
</svg>
